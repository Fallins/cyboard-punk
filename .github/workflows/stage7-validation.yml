name: Stage 7 macOS Validation

on:
  push:
    branches:
      - feature/visual-agent-workflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Stage 7 validation
    runs-on: macos-14
    timeout-minutes: 30
    env:
      VITE_NYX_EXPERIMENTAL_RUNTIME: stage7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust components
        run: rustup component add rustfmt clippy

      - name: Install dependencies
        run: bun install

      - name: Validate frontend and NYX contracts
        run: bun run check

      - name: Validate experimental production build
        run: bun run build

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Confirm Stage 7 remains opt-in
        run: |
          grep -q 'VITE_NYX_EXPERIMENTAL_RUNTIME' src/ui/Nyx2DManagedRuntime.tsx
          grep -q 'productionDefaultRendererChanged.*false' assets/operator/nyx-redesign/experimental/stage-07/stage-07-manifest.json
