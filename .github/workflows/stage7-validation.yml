name: Stage 7 macOS Validation

on:
  push:
    branches:
      - feature/visual-agent-workflow
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage7-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Stage 7 validation
    runs-on: macos-14
    timeout-minutes: 30
    env:
      VITE_NYX_EXPERIMENTAL_RUNTIME: stage7

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust components
        run: rustup component add rustfmt clippy

      - name: Install dependencies
        run: bun install

      - name: Validate frontend and NYX contracts
        run: bun run check

      - name: Validate experimental production build
        run: bun run build

      - name: Confirm Stage 7 did not modify Rust backend
        run: git diff --exit-code 242712958954e04d06081b1d9ce5a151e6ca7200 HEAD -- src-tauri

      - name: Prepare Tauri generated icons
        run: bun run prepare:icons

      - name: Audit repository Rust formatting baseline
        run: |
          if cargo fmt --manifest-path src-tauri/Cargo.toml -- --check; then
            echo "Rust formatting baseline is clean."
          else
            echo "::warning::Repository-wide rustfmt drift predates Stage 7. Stage 7 changes do not touch src-tauri; continuing clippy/tests without mass-formatting unrelated backend files."
          fi

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Setup Chromium capture tools
        run: |
          python3 -m venv .stage7-venv
          .stage7-venv/bin/pip install --disable-pip-version-check playwright pillow
          .stage7-venv/bin/python -m playwright install chromium

      - name: Capture Stage 7 runtime in Chromium
        run: |
          mkdir -p stage7-browser-artifacts
          bunx vite --host 127.0.0.1 --port 4173 > stage7-browser-artifacts/vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/stage7-runtime.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/stage7-runtime.html >/dev/null
          .stage7-venv/bin/python scripts/stage7-browser-smoke.py http://127.0.0.1:4173

      - name: Upload Stage 7 browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-browser-captures
          path: stage7-browser-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Confirm Stage 7 remains opt-in
        run: |
          grep -q 'VITE_NYX_EXPERIMENTAL_RUNTIME' src/ui/Nyx2DManagedRuntime.tsx
          grep -q 'productionDefaultRendererChanged.*false' assets/operator/nyx-redesign/experimental/stage-07/stage-07-manifest.json
